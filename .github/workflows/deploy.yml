name: Deploy to GitHub Pages

on:
  # Every push to main rebuilds and deploys the site
  push:
    branches: [main]
  # Allows a manual run from the repo's Actions tab
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: read the repo, write to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
